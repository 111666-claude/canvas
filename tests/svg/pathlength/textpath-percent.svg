<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
  <!-- percentage startOffset always resolves against pathLength: 25% of the
       declared length places the text at the quarter point of the curve -->
  <path id="tp" d="M20 80 C 60 20, 180 20, 220 80" pathLength="100" fill="none" stroke="#ccc"/>
  <text font-family="serif" font-size="18" fill="black">
    <textPath href="#tp" startOffset="25%">Quarter</textPath>
  </text>
</svg>
