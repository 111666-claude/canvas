<svg xmlns="http://www.w3.org/2000/svg" width="200" height="40" viewBox="0 0 200 40">
  <!-- pathLength redefines the 200-unit line as length 100: the 10/10
       normalized dash pattern maps back to 20/20 user units, so it must
       rasterize identically to dash-reference.svg -->
  <line x1="0" y1="20" x2="200" y2="20" pathLength="100" stroke="black" stroke-width="4" stroke-dasharray="10 10"/>
</svg>
