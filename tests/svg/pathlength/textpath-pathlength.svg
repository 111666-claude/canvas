<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
  <!-- same geometry declared with pathLength 100. The startOffset is given in
       normalized units; 10 units must land at the same fraction of the path
       as 20 user units do in the reference (both are 10% of the path) -->
  <path id="tp" d="M20 80 C 60 20, 180 20, 220 80" pathLength="100" fill="none" stroke="#ccc"/>
  <text font-family="serif" font-size="18" fill="black">
    <textPath href="#tp" startOffset="10">Normalized</textPath>
  </text>
</svg>
