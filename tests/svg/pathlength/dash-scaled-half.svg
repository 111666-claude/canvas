<svg xmlns="http://www.w3.org/2000/svg" width="100" height="40" viewBox="0 0 100 40">
  <!-- same normalized pattern on a geometry half as long: dash fraction of
       the path stays constant (one dash per 20% of the path) -->
  <line x1="0" y1="20" x2="100" y2="20" pathLength="100" stroke="black" stroke-width="4" stroke-dasharray="10 10"/>
</svg>
