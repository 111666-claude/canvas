name: Go
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install OpenGL
      run: |
          sudo apt update
          sudo apt install -y xorg-dev libgl1-mesa-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libvulkan-dev
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '>=1.25'
    - name: Build
      run: go build -v ./...
    - name: Tests with coverage
      run: go test -race -v -count=1 -coverprofile=coverage.out ./...
    - name: Render statistics gate
      # The gate also runs as part of `go test ./...`, but this explicit run
      # makes a failure (with its per-op diff) easy to find in the log and
      # emits per-frame JSON for triage.
      run: |
          go test -race -count=1 ./renderstats
          go test -count=1 ./renderstats -run TestGateBaseline -renderstats.emit=artifacts/renderstats
    - name: Upload render statistics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renderstats
        path: artifacts/renderstats
        if-no-files-found: ignore
    - name: Upload Code Coverage
      uses: codecov/codecov-action@v5
      with:
        name: codecov
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
